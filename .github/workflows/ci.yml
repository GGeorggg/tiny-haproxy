name: CI

on:
  pull_request:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pushes to the same branch (or new commits to the same PR) cancel the previous
  # run; separate PRs and separate branches run independently.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Dockerfile, workflows, scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

      - name: zizmor (workflow security)
        run: pipx run zizmor --config .github/zizmor.yml .github/workflows

      - name: shellcheck
        run: shellcheck scripts/*.sh .devcontainer/*.sh

  image:
    name: Build, config check, smoke test, scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image (amd64, loaded locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tiny-haproxy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: haproxy -c (config check with throw-away certs)
        run: |
          scripts/gen-test-certs.sh .test-certs
          docker run --rm --entrypoint sh \
            -v "$PWD/.test-certs/site.pem:/etc/haproxy/certs/site.pem:ro" \
            -v "$PWD/.test-certs/ca.crt:/etc/haproxy/certs/ca.crt:ro" \
            tiny-haproxy:ci -c 'assemble-config.sh && haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg'

      - name: Smoke test (mTLS, ACME, geo deny, headers, limits)
        id: smoke
        run: scripts/smoke-test.sh tiny-haproxy:ci

      - name: Dump assembled haproxy.cfg to summary
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          {
            echo '### Assembled haproxy.cfg'
            echo '```haproxy'
            docker run --rm --entrypoint sh \
              -v "$PWD/.test-certs/site.pem:/etc/haproxy/certs/site.pem:ro" \
              -v "$PWD/.test-certs/ca.crt:/etc/haproxy/certs/ca.crt:ro" \
              tiny-haproxy:ci -c 'assemble-config.sh && cat /usr/local/etc/haproxy/haproxy.cfg'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump captured SPOA log into summary
        if: always() && hashFiles('smoke-logs/spoa.log') != ''
        run: |
          {
            echo '### SPOE agent log (tail, 60 lines)'
            echo '```'
            tail -n 60 smoke-logs/spoa.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke test logs
        if: always() && hashFiles('smoke-logs/*.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs
          path: smoke-logs/
          if-no-files-found: warn

      - name: SPOE HELLO framing probe (debug)
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          CID=$(docker run -d --name spoe-probe \
            -v "$PWD/scripts/dummy-spoa.py:/dummy-spoa.py:ro" \
            python:3.13-alpine python /dummy-spoa.py)
          sleep 1
          docker cp "$PWD/scripts/spoe-probe.py" "$CID:/spoe-probe.py"
          docker run --rm --network "container:$CID" \
            -v "$PWD/scripts/spoe-probe.py:/spoe-probe.py:ro" \
            python:3.13-alpine python /spoe-probe.py || true
          echo "===== agent log ====="
          docker logs "$CID" 2>&1 || true
          docker rm -f "$CID" >/dev/null 2>&1 || true

      - name: Trivy config + secret scan (repo)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: misconfig,secret
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tiny-haproxy:ci
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0" # reported in code scanning; the gate below fails the job

      - name: Upload SARIF
        if: always() && hashFiles('trivy-image.sarif') != '' && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Trivy image gate (fixable HIGH/CRITICAL fails the build)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tiny-haproxy:ci
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"