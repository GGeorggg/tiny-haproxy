name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    # Auto-rebuild weekly on Sunday at midnight to refresh GeoIP/ASN rules
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM build emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Repository Owner to Lowercase
        id: prep
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image (GHCR)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner_lc }}/tiny-haproxy:latest
            ghcr.io/${{ steps.prep.outputs.owner_lc }}/tiny-haproxy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max