# /etc/haproxy/backends.d/01-app-web.cfg
# Backend: Standard Web App (Fail-Open SPOE - Default)
# If SPOA agent is offline or fails, connection proceeds to web server normally.

backend app_web_backend
    mode http
    balance roundrobin

    # SPOE Enforcement (Fail-Open): Only deny if SPOA explicitly responded AND marked malicious
    acl spoe_flagged var(txn.ip_checker.is_malicious) -m bool
    acl spoe_responded var(txn.ip_checker.is_malicious) -m found
    http-request deny status 403 if spoe_responded spoe_flagged

    server web1 192.168.1.100:8080 check maxconn 5