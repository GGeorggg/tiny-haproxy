# Resolver-only avahi for the HAProxy container: look up *.local, announce nothing.
[server]
use-ipv4=yes
use-ipv6=no
# Interface name INSIDE the container (veth on RouterOS). Adjust if it differs.
allow-interfaces=eth0
enable-dbus=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[publish]
disable-publishing=yes
disable-user-service-publishing=yes

[wide-area]
enable-wide-area=no

[reflector]
enable-reflector=no
