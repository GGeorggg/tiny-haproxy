global
    log stdout format raw local0
    # Worst case memory ~ maxconn * 2 * bufsize (~3 MB), fits the 16M container limit.
    maxconn 100
    tune.bufsize 16384
    # Certificates are read as root at startup, then privileges are dropped.
    user haproxy
    group haproxy
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.3 prefer-client-ciphers

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    # Slowloris protection
    timeout http-request    10s
    timeout http-keep-alive 5s
    maxconn 100

frontend https_in
    # mTLS is mandatory on 443 ("verify optional" would let clients without a certificate through).
    bind *:443 ssl crt /etc/haproxy/certs/site.pem ca-file /etc/haproxy/certs/ca.crt verify required
    bind *:80

    # ---------------------------------------------------------------------
    # 0. ACME + HTTPS redirect (must come BEFORE geo/mTLS denies:
    #    Let's Encrypt validates from many locations outside the whitelist)
    # ---------------------------------------------------------------------
    acl is_acme path_beg /.well-known/acme-challenge/
    http-request allow if is_acme { method GET HEAD } !{ ssl_fc }
    http-request redirect scheme https code 301 if !{ ssl_fc }

    # ---------------------------------------------------------------------
    # 1. GeoIP & ASN whitelisting (AT + 8 neighbours, or Austrian ASNs)
    # ---------------------------------------------------------------------
    acl is_allowed_geo src -f /etc/haproxy/whitelists/geoip.lst
    acl is_allowed_asn src -f /etc/haproxy/whitelists/asns.lst
    http-request deny status 403 unless is_allowed_geo or is_allowed_asn

    # ---------------------------------------------------------------------
    # 2. Hardening
    # ---------------------------------------------------------------------
    # Defence in depth next to "verify required"
    http-request deny status 403 unless { ssl_fc } { ssl_c_used } { ssl_c_verify 0 }

    # httpoxy and URL rewrite header injection
    http-request del-header Proxy
    http-request del-header X-Powered-By
    http-request del-header X-Original-URL
    http-request del-header X-Rewrite-URL

    # Reject oversized bodies announced via Content-Length (8 MiB).
    # Chunked uploads cannot be limited here, enforce a limit in the backend as well.
    http-request deny status 413 if { req.hdr_val(content-length) gt 8388608 }

    # Never trust client supplied forwarding headers, this proxy is the edge
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Real-IP
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Real-IP %[src]

    # Response header hardening
    http-response del-header Server
    http-response del-header X-Powered-By
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-Frame-Options "DENY"

    use_backend acme_backend if is_acme
    default_backend local_backend

# Container health check endpoint, only reachable from inside the container
frontend healthz
    bind 127.0.0.1:8404
    monitor-uri /healthz

backend local_backend
    server app1 127.0.0.1:8080 check

backend acme_backend
    server acme 127.0.0.1:8888
